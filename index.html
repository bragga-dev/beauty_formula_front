<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon / ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0b" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fórmula da Beleza — Salão de Beleza. Agende seu horário com praticidade." />
    <title>Fórmula da Beleza</title>

    <!-- Open Graph (preview ao compartilhar em WhatsApp, Instagram, etc.) -->
    <!-- IMPORTANTE: troque os `content="/og-image.jpg"` abaixo pela URL -->
    <!-- absoluta (ex.: https://seudominio.com.br/og-image.jpg) assim que -->
    <!-- o domínio de produção estiver definido — alguns leitores de OG -->
    <!-- (WhatsApp, LinkedIn) não resolvem caminho relativo corretamente. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fórmula da Beleza" />
    <meta property="og:title" content="Fórmula da Beleza — Salão de Beleza" />
    <meta property="og:description" content="Agende seu horário com praticidade: serviços, produtos e nosso time de especialistas." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fórmula da Beleza — Salão de Beleza" />
    <meta name="twitter:description" content="Agende seu horário com praticidade: serviços, produtos e nosso time de especialistas." />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
