# =========================================================
# nginx.conf — Formula da Beleza
# Salve como "nginx.conf" na raiz do projeto frontend
# (mesma pasta do Dockerfile acima)
# =========================================================

server {
    listen 80;
    server_name _;  # troque pelo seu domínio, ex: formuladabeleza.com.br

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ---------------------------------------------------
    # 1) FRONTEND (SPA React/Vite)
    #    Qualquer rota que não seja arquivo real cai no
    #    index.html — quem decide a rota é o React Router.
    # ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------
    # 2) API do Django (gunicorn rodando no serviço "web")
    #    "web" é o nome do serviço no docker-compose —
    #    o Docker resolve isso via DNS interno da rede.
    # ---------------------------------------------------
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------
    # 3) Django Admin
    # ---------------------------------------------------
    location /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------
    # 4) Arquivos estáticos do Django (CSS/JS do admin etc.)
    #    Vêm de um volume compartilhado com o container "web"
    #    (STATIC_ROOT = /app/staticfiles, gerado por collectstatic)
    # ---------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
    }

    # ---------------------------------------------------
    # 5) Mídia (uploads) — hoje fica no MinIO.
    #    Se o MINIO_BUCKET_MEDIA já é público (anonymous download),
    #    o ideal é apontar AWS_S3_CUSTOM_DOMAIN direto pro domínio
    #    do MinIO/S3 e NEM passar por aqui. Este bloco é só um
    #    fallback caso você prefira esconder o MinIO atrás do Nginx.
    # ---------------------------------------------------
    location /media/ {
        proxy_pass http://minio:9000/beautyformulamedia/;
        proxy_set_header Host $host;
    }
}